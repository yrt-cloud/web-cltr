<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Pro - Grafik Penjualan</title>
    <!-- Tambahkan Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --accent: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #1e293b;
            --border: #e2e8f0;
            --overlay: rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            background: #fff;
            width: 98%;
            max-width: 1250px;
            height: 95vh;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 15px;
            gap: 15px;
            position: relative;
        }

        /* MASTER BARANG */
        .master-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            padding-right: 15px;
            min-width: 280px;
        }

        .master-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 10px;
            outline: none;
        }

        .master-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }

        .master-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .master-item:hover {
            border-color: var(--accent);
            background: #f0f7ff;
        }

        .master-item-info b { font-size: 13px; text-transform: uppercase; display: block; margin-right: 60px; }
        .master-item-info span { font-size: 12px; color: var(--accent); font-weight: 600; }

        .btn-delete-master {
            position: absolute;
            right: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            color: #94a3b8;
            transition: color 0.2s;
            z-index: 2;
        }

        .btn-delete-master:hover { color: var(--danger); }
        .btn-delete-master svg { width: 18px; height: 18px; fill: currentColor; }

        /* STRUK AREA (CENTER) */
        .receipt-section {
            flex: 0 0 320px;
            display: flex;
            flex-direction: column;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .receipt-view {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            line-height: 1.4;
            background: #ffffff;
        }

        .thermal-header { text-align: center; margin-bottom: 10px; position: relative; }
        .thermal-header h1 { font-size: 14px; text-transform: uppercase; margin-bottom: 2px; }
        .thermal-header p { font-size: 10px; color: #333; }

        .btn-settings {
            position: absolute;
            top: -10px;
            right: -10px;
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            padding: 5px;
        }
        .btn-settings svg { width: 16px; height: 16px; fill: currentColor; }
        .btn-settings:hover { color: var(--accent); }

        .dashed-line { border-top: 1px dashed #bbb; margin: 10px 0; }

        .cart-row { margin-bottom: 10px; }
        .cart-top { display: flex; justify-content: space-between; font-weight: bold; }
        .cart-bottom { font-size: 11px; color: #444; display: flex; align-items: center; gap: 5px; margin-top: 2px; }

        .qty-badge { background: #f1f5f9; border: 1px solid #e2e8f0; padding: 1px 5px; border-radius: 4px; font-size: 10px; color: #000; }

        .summary-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .total-large { font-size: 18px; font-weight: 900; margin-top: 8px; color: #000; }

        /* CALCULATOR & HISTORY */
        .calc-section {
            flex: 0 0 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-left: 1px solid var(--border);
            padding-left: 15px;
        }

        .calc-display {
            background: var(--dark);
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            text-align: right;
            font-size: 24px;
            font-family: monospace;
            min-height: 60px;
        }

        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .btn {
            padding: 12px 5px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            background: #e2e8f0;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.7; }

        .btn-op { background: #f59e0b; color: white; }
        .btn-num { background: #fff; border: 1px solid var(--border); }

        /* TRANSAKSI HISTORY */
        .history-panel {
            flex-grow: 1;
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px;
            overflow-y: auto;
            font-family: sans-serif;
            border: 1px solid var(--border);
        }

        .history-title { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: bold; 
            font-size: 11px; 
            margin-bottom: 10px; 
            color: #64748b; 
            text-transform: uppercase; 
        }

        .trx-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 11px;
        }

        .trx-card-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: bold; color: var(--dark); }
        .trx-card-body { color: #64748b; margin-bottom: 8px; }
        .trx-card-footer { display: flex; justify-content: space-between; align-items: center; }
        .btn-reprint { background: var(--accent); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; }

        /* MODAL SYSTEM */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--overlay);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 650px; /* Lebarkan sedikit untuk grafik */
            max-width: 95%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 15px; color: var(--dark); }
        .modal-total { font-size: 32px; font-weight: 900; color: var(--accent); margin-bottom: 20px; }
        
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 5px; }
        .modal-input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            outline: none;
            text-align: center;
        }
        .modal-input:focus { border-color: var(--accent); }

        .modal-footer { display: flex; gap: 10px; margin-top: 20px; }
        .btn-modal { flex: 1; padding: 15px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }

        /* SETTINGS & REPORTS */
        .settings-grid {
            display: grid;
            gap: 15px;
            text-align: left;
        }

        .chart-container {
            width: 100%;
            height: 250px;
            background: #fff;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .report-section {
            margin-top: 20px;
            text-align: left;
            border-top: 2px solid var(--border);
            padding-top: 15px;
        }

        .date-group {
            margin-bottom: 15px;
        }

        .date-header {
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            color: var(--dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .date-total {
            color: var(--success);
        }

        .report-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 11px;
            color: #64748b;
        }

        /* PRINT STYLE */
        @media print {
            .no-print, .calc-section, .master-section, .btn-remove, .qty-badge button, .btn-settings, .save-indicator { display: none !important; }
            body, .app-container { background: white; padding: 0; margin: 0; display: block; height: auto; width: 100%; box-shadow: none; }
            .receipt-section { border: none; width: 100%; max-width: 80mm; margin: 0 auto; box-shadow: none; }
            .receipt-view { background: white; overflow: visible; font-size: 10pt; padding: 0; }
            .qty-badge { border: none; background: transparent; padding: 0; }
        }

        .btn-remove { color: var(--danger); cursor: pointer; margin-left: auto; display: flex; align-items: center; }
        .btn-remove svg { width: 14px; height: 14px; fill: currentColor; }

        /* STATUS SAVED */
        .save-indicator {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 10px;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0.7;
        }
    </style>
</head>
<body onload="init()">

<div class="save-indicator no-print">
    <div style="width: 6px; height: 6px; background: var(--success); border-radius: 50%;"></div>
    Autosave Aktif
</div>

<div class="app-container">
    <!-- MASTER BARANG -->
    <div class="master-section no-print">
        <div class="master-header">
            <h3>MASTER BARANG</h3>
            <button class="btn" style="background: var(--success); color:white; padding: 5px 12px;" onclick="addManual()">+ BARANG</button>
        </div>
        <input type="text" class="search-input" id="searchBar" placeholder="Cari barang..." oninput="renderMaster()">
        <div class="master-list" id="masterItems"></div>
    </div>

    <!-- STRUK PEMBAYARAN -->
    <div class="receipt-section">
        <div class="receipt-view" id="printArea">
            <div class="thermal-header">
                <button class="btn-settings no-print" onclick="toggleSettings()" title="Pengaturan & Laporan">
                    <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </button>
                <h1 id="shopNameDisplay">KOPERASI SWADHARMA</h1>
                <p id="shopAddrDisplay">Jl. Asia Afrika No.119, Bandung</p>
                <div class="dashed-line"></div>
                <div style="display: flex; justify-content: space-between; font-size: 9px;">
                    <span id="trxDate"></span>
                    <span id="trxId"></span>
                </div>
                <div class="dashed-line"></div>
            </div>

            <div id="cartContent"></div>

            <div id="summaryArea">
                <div class="dashed-line"></div>
                <div class="summary-row">
                    <span>ITEM TOTAL</span>
                    <span id="totalQty">0</span>
                </div>
                <div class="summary-row total-large">
                    <span>TOTAL</span>
                    <span id="grandTotal">0</span>
                </div>
            </div>

            <div id="paymentResult" style="display:none; margin-top: 15px;">
                <div class="summary-row"><span>TUNAI</span> <span id="resCash">0</span></div>
                <div class="summary-row"><span>KEMBALI</span> <span id="resChange">0</span></div>
                <div class="dashed-line"></div>
                <p style="text-align: center; font-size: 10px; margin-top: 15px; font-weight: bold;">TERIMA KASIH</p>
            </div>
        </div>

        <div class="no-print" style="padding: 10px; display: grid; gap: 8px; border-top: 1px solid var(--border);">
            <div style="display: flex; gap: 5px;">
                <button class="btn" style="flex:1; background: var(--danger); color:white;" onclick="resetTransaction()">RESET (R)</button>
                <button class="btn" style="flex:1; background: var(--accent); color:white;" onclick="openPayModal()">BAYAR (SPACE)</button>
            </div>
            <button class="btn" style="width:100%; background: var(--dark); color:white;" onclick="printStruk()">CETAK STRUK (P)</button>
        </div>
    </div>

    <!-- CALCULATOR & RIWAYAT -->
    <div class="calc-section no-print">
        <div class="calc-display" id="calcDisplay">0</div>
        <div class="calc-grid">
            <button class="btn btn-op" onclick="clearCalc()">C</button>
            <button class="btn btn-op" onclick="backspace()">DEL</button>
            <button class="btn btn-op" onclick="op('/')">÷</button>
            <button class="btn btn-op" onclick="op('*')">×</button>
            
            <button class="btn btn-num" onclick="num('7')">7</button>
            <button class="btn btn-num" onclick="num('8')">8</button>
            <button class="btn btn-num" onclick="num('9')">9</button>
            <button class="btn btn-op" onclick="op('-')">−</button>
            
            <button class="btn btn-num" onclick="num('4')">4</button>
            <button class="btn btn-num" onclick="num('5')">5</button>
            <button class="btn btn-num" onclick="num('6')">6</button>
            <button class="btn btn-op" onclick="op('+')">+</button>
            
            <button class="btn btn-num" onclick="num('1')">1</button>
            <button class="btn btn-num" onclick="num('2')">2</button>
            <button class="btn btn-num" onclick="num('3')">3</button>
            <button class="btn btn-op" style="background:#3b82f6" onclick="addToCartManual()">OK</button>
            
            <button class="btn btn-num" onclick="num('0')">0</button>
            <button class="btn btn-num" onclick="num('00')">00</button>
            <button class="btn btn-num" onclick="num('000')">000</button>
            <button class="btn btn-num" onclick="num('.')">.</button>
        </div>

        <div class="history-panel">
            <div class="history-title">
                Riwayat Cepat (20 Terakhir)
                <span style="color:var(--danger); cursor:pointer; font-size:9px;" onclick="clearAllHistory()">Hapus Semua</span>
            </div>
            <div id="trxHistoryLog"></div>
        </div>
    </div>
</div>

<!-- MODAL BAYAR -->
<div class="modal-overlay" id="payModal">
    <div class="modal-content">
        <div class="modal-title">TOTAL PEMBAYARAN</div>
        <div class="modal-total" id="modalTotalLabel">Rp 0</div>
        
        <div class="input-group">
            <label>NOMINAL TUNAI (Ribu atau Lengkap)</label>
            <input type="text" class="modal-input" id="cashInput" placeholder="Contoh: 50 atau 50000">
        </div>

        <div class="modal-footer">
            <button class="btn-modal" style="background: #f1f5f9; color: #64748b;" onclick="closePayModal()">BATAL (ESC)</button>
            <button class="btn-modal" style="background: var(--accent); color: white;" onclick="processPayment()">PROSES (ENTER)</button>
        </div>
    </div>
</div>

<!-- MODAL PENGATURAN, GRAFIK & LAPORAN -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
        <div class="modal-title">PENJUALAN & PENGATURAN</div>
        
        <div class="settings-grid">
            <!-- AREA GRAFIK -->
            <div class="chart-container">
                <canvas id="salesChart"></canvas>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex:1">
                    <label>NAMA TOKO</label>
                    <input type="text" class="modal-input" id="settingShopName" style="font-size: 14px; text-align: left; padding: 10px;">
                </div>
                <div class="input-group" style="flex:1">
                    <label>ALAMAT TOKO</label>
                    <input type="text" class="modal-input" id="settingShopAddr" style="font-size: 14px; text-align: left; padding: 10px;">
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: -10px;">
                <button class="btn" style="flex:1; background: var(--dark); color:white; font-size: 11px;" onclick="exportData()">BACKUP (.json)</button>
                <button class="btn" style="flex:1; background: var(--accent); color:white; font-size: 11px;" onclick="triggerRestore()">RESTORE (.json)</button>
                <input type="file" id="restoreFile" style="display:none" accept=".json" onchange="handleRestore(this)">
            </div>

            <!-- LAPORAN HARIAN -->
            <div class="report-section">
                <h4 style="font-size: 13px; margin-bottom: 10px; color: var(--dark);">REKAPITULASI PENJUALAN HARIAN</h4>
                <div id="dailyReportContainer" style="max-height: 200px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 10px;">
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-modal" style="background: #f1f5f9; color: #64748b;" onclick="toggleSettings()">TUTUP</button>
            <button class="btn-modal" style="background: var(--success); color: white;" onclick="saveSettings()">SIMPAN PERUBAHAN</button>
        </div>
    </div>
</div>

<script>
    const trashIcon = `<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;

    let masterData = [
        { name: "BERAS PREMIUM 5KG", price: 75000 },
        { name: "GULA PASIR 1KG", price: 16500 },
        { name: "KOPI BUBUK 165G", price: 12500 }
    ];

    let cart = [];
    let transactionHistory = [];
    let currentCalc = "0";
    let currentTrxId = "";
    let salesChart = null;

    function init() {
        const localMaster = localStorage.getItem('master_items');
        if(localMaster) masterData = JSON.parse(localMaster);
        
        const localHistory = localStorage.getItem('trx_history');
        if(localHistory) transactionHistory = JSON.parse(localHistory);

        const shopName = localStorage.getItem('shop_name') || "KOPERASI SWADHARMA";
        const shopAddr = localStorage.getItem('shop_addr') || "Jl. Asia Afrika No.119, Bandung";
        
        document.getElementById('shopNameDisplay').innerText = shopName;
        document.getElementById('shopAddrDisplay').innerText = shopAddr;
        document.getElementById('settingShopName').value = shopName;
        document.getElementById('settingShopAddr').value = shopAddr;

        newTransaction();
        renderMaster();
        renderHistory();

        window.addEventListener('keydown', (e) => {
            const isTyping = document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA';
            if (isTyping) {
                if (e.key === 'Enter' && document.getElementById('payModal').style.display === 'flex') processPayment();
                if (e.key === 'Escape') {
                    closePayModal();
                    if(document.getElementById('settingsModal').style.display === 'flex') toggleSettings();
                }
                return; 
            }
            if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); openPayModal(); }
            else if (e.key === 'p' || e.key === 'P') { printStruk(); }
            else if (e.key === 'r' || e.key === 'R') { resetTransaction(); }
            else if (e.key === 'Escape') { closePayModal(); }
        });
    }

    function format(n) { return Number(n).toLocaleString('id-ID'); }

    function newTransaction() {
        cart = [];
        currentTrxId = "TRX-" + Date.now().toString().slice(-6);
        document.getElementById('trxId').innerText = currentTrxId;
        document.getElementById('trxDate').innerText = new Date().toLocaleString('id-ID');
        document.getElementById('paymentResult').style.display = 'none';
        document.getElementById('summaryArea').style.display = 'block';
        renderCart();
    }

    function resetTransaction() {
        if(confirm("Batalkan transaksi saat ini?")) newTransaction();
    }

    function toggleSettings() {
        const modal = document.getElementById('settingsModal');
        const isOpen = modal.style.display === 'flex';
        modal.style.display = isOpen ? 'none' : 'flex';
        if (!isOpen) {
            renderDailyReport();
            renderSalesChart();
        }
    }

    function saveSettings() {
        const name = document.getElementById('settingShopName').value;
        const addr = document.getElementById('settingShopAddr').value;
        localStorage.setItem('shop_name', name);
        localStorage.setItem('shop_addr', addr);
        document.getElementById('shopNameDisplay').innerText = name;
        document.getElementById('shopAddrDisplay').innerText = addr;
        toggleSettings();
    }

    function renderMaster() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const container = document.getElementById('masterItems');
        container.innerHTML = "";
        const filtered = masterData.filter(i => i.name.toLowerCase().includes(query)).sort((a,b) => a.name.localeCompare(b.name));
        filtered.forEach((item) => {
            const div = document.createElement('div');
            div.className = "master-item";
            div.onclick = (e) => { if (!e.target.closest('.btn-delete-master')) addToCart(item.name, item.price); };
            div.innerHTML = `<div class="master-item-info"><b>${item.name}</b><span>Rp ${format(item.price)}</span></div>
                <div class="btn-delete-master" onclick="deleteFromMaster('${item.name.replace(/'/g, "\\'")}')">${trashIcon}</div>
                <div style="color: var(--success); font-size: 18px; margin-left: 10px;">+</div>`;
            container.appendChild(div);
        });
    }

    function addManual() {
        const n = prompt("Nama Barang:").toUpperCase();
        if(!n) return;
        const p = parseFloat(prompt("Harga:"));
        if(n && !isNaN(p)) {
            masterData.push({name: n, price: p});
            localStorage.setItem('master_items', JSON.stringify(masterData));
            renderMaster();
        }
    }

    function deleteFromMaster(name) {
        if(confirm(`Hapus "${name}" dari master?`)) {
            masterData = masterData.filter(item => item.name !== name);
            localStorage.setItem('master_items', JSON.stringify(masterData));
            renderMaster();
        }
    }

    function addToCart(name, price) {
        const idx = cart.findIndex(i => i.name === name);
        if(idx > -1) cart[idx].qty++;
        else cart.push({ name, price, qty: 1 });
        renderCart();
    }

    function removeCart(idx) { cart.splice(idx, 1); renderCart(); }
    function updateQty(idx, delta) {
        cart[idx].qty += delta;
        if(cart[idx].qty <= 0) cart.splice(idx, 1);
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartContent');
        container.innerHTML = "";
        let total = 0, q = 0;
        cart.forEach((item, i) => {
            const sub = item.price * item.qty;
            total += sub; q += item.qty;
            const div = document.createElement('div');
            div.className = "cart-row";
            div.innerHTML = `<div class="cart-top"><span>${item.name}</span><span>${format(sub)}</span></div>
                <div class="cart-bottom"><span class="qty-badge">${item.qty}</span> x ${format(item.price)}
                    <div class="no-print" style="margin-left: 10px; display:flex; gap: 5px;">
                        <button onclick="updateQty(${i}, -1)" style="padding:0 5px; cursor:pointer;">-</button>
                        <button onclick="updateQty(${i}, 1)" style="padding:0 5px; cursor:pointer;">+</button>
                    </div>
                    <span class="btn-remove no-print" onclick="removeCart(${i})">${trashIcon}</span></div>`;
            container.appendChild(div);
        });
        document.getElementById('totalQty').innerText = q;
        document.getElementById('grandTotal').innerText = format(total);
    }

    function openPayModal() {
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        if(total === 0) return;
        document.getElementById('modalTotalLabel').innerText = "Rp " + format(total);
        document.getElementById('payModal').style.display = 'flex';
        document.getElementById('cashInput').value = "";
        setTimeout(() => document.getElementById('cashInput').focus(), 100);
    }

    function closePayModal() { document.getElementById('payModal').style.display = 'none'; }

    function processPayment() {
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        let cashRaw = document.getElementById('cashInput').value;
        let cash = parseFloat(cashRaw.replace(/\./g, ''));
        if(isNaN(cash)) return;
        if(cash < total && cash > 0 && cash < 1000) cash *= 1000;
        if(cash >= total) {
            const now = new Date();
            const trx = {
                id: currentTrxId,
                date: now.toLocaleString('id-ID'),
                dateKey: now.toLocaleDateString('id-ID'),
                items: JSON.parse(JSON.stringify(cart)),
                total: total,
                cash: cash,
                change: cash - total,
                timestamp: now.getTime()
            };
            transactionHistory.unshift(trx);
            localStorage.setItem('trx_history', JSON.stringify(transactionHistory));
            document.getElementById('resCash').innerText = format(cash);
            document.getElementById('resChange').innerText = format(cash - total);
            document.getElementById('paymentResult').style.display = 'block';
            renderHistory();
            closePayModal();
        } else { alert("Uang tunai kurang!"); }
    }

    function printStruk() { window.print(); }

    function renderHistory() {
        const log = document.getElementById('trxHistoryLog');
        log.innerHTML = "";
        transactionHistory.slice(0, 20).forEach((trx, index) => {
            const div = document.createElement('div');
            div.className = "trx-card";
            div.innerHTML = `<div class="trx-card-header"><span>${trx.id}</span><span>Rp ${format(trx.total)}</span></div>
                <div class="trx-card-body">${trx.date} (${trx.items.length} item)</div>
                <div class="trx-card-footer">
                    <button class="btn-reprint" onclick="reprintTrx(${index})">MUAT & CETAK</button>
                    <span style="color:var(--danger); cursor:pointer;" onclick="deleteTrx(${index})">${trashIcon}</span>
                </div>`;
            log.appendChild(div);
        });
    }

    function reprintTrx(idx) {
        const trx = transactionHistory[idx];
        cart = JSON.parse(JSON.stringify(trx.items));
        currentTrxId = trx.id;
        document.getElementById('trxId').innerText = trx.id;
        document.getElementById('trxDate').innerText = trx.date;
        document.getElementById('resCash').innerText = format(trx.cash);
        document.getElementById('resChange').innerText = format(trx.change);
        document.getElementById('paymentResult').style.display = 'block';
        document.getElementById('summaryArea').style.display = 'block';
        renderCart();
    }

    function deleteTrx(idx) {
        if(confirm("Hapus transaksi ini dari riwayat?")) {
            transactionHistory.splice(idx, 1);
            localStorage.setItem('trx_history', JSON.stringify(transactionHistory));
            renderHistory();
        }
    }

    function clearAllHistory() {
        if(confirm("Hapus SELURUH riwayat transaksi?")) {
            transactionHistory = [];
            localStorage.setItem('trx_history', "[]");
            renderHistory();
        }
    }

    function num(v) { if(currentCalc === "0") currentCalc = v; else currentCalc += v; updateCalc(); }
    function op(v) { currentCalc += v; updateCalc(); }
    function clearCalc() { currentCalc = "0"; updateCalc(); }
    function backspace() { currentCalc = currentCalc.slice(0, -1) || "0"; updateCalc(); }
    function updateCalc() { document.getElementById('calcDisplay').innerText = currentCalc; }
    
    function addToCartManual() {
        try {
            let res = eval(currentCalc);
            if(!isNaN(res) && res > 0) { addToCart("ITEM MANUAL", res); clearCalc(); }
        } catch(e) { alert("Input tidak valid"); }
    }

    function renderDailyReport() {
        const container = document.getElementById('dailyReportContainer');
        container.innerHTML = "";
        const grouped = transactionHistory.reduce((acc, trx) => {
            const key = trx.dateKey || trx.date.split(',')[0];
            if(!acc[key]) acc[key] = { total: 0, count: 0, items: [] };
            acc[key].total += trx.total;
            acc[key].count += 1;
            acc[key].items.push(trx);
            return acc;
        }, {});
        Object.keys(grouped).sort((a,b) => b.localeCompare(a)).forEach(date => {
            const data = grouped[date];
            const section = document.createElement('div');
            section.className = "date-group";
            section.innerHTML = `<div class="date-header"><span>${date} (${data.count})</span><span class="date-total">Rp ${format(data.total)}</span></div>`;
            data.items.forEach(item => {
                const row = document.createElement('div');
                row.className = "report-item";
                row.innerHTML = `<span>${item.id}</span><span>Rp ${format(item.total)}</span>`;
                section.appendChild(row);
            });
            container.appendChild(section);
        });
    }

    // FUNGSI GRAFIK
    function renderSalesChart() {
        const ctx = document.getElementById('salesChart').getContext('2d');
        
        // Ambil data 7 hari terakhir
        const dailySales = {};
        const labels = [];
        for(let i=6; i>=0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const key = d.toLocaleDateString('id-ID');
            dailySales[key] = 0;
            labels.push(key.split('/')[0] + '/' + key.split('/')[1]); // Format tgl/bln
        }

        transactionHistory.forEach(trx => {
            const key = trx.dateKey || trx.date.split(',')[0];
            if(dailySales.hasOwnProperty(key)) {
                dailySales[key] += trx.total;
            }
        });

        const dataPoints = Object.values(dailySales);

        if(salesChart) salesChart.destroy();

        salesChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Omzet Penjualan (7 Hari Terakhir)',
                    data: dataPoints,
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 4,
                    pointBackgroundColor: '#2563eb'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) { return 'Rp ' + (value/1000) + 'rb'; }
                        }
                    }
                }
            }
        });
    }

    function exportData() {
        const data = { master_items: masterData, trx_history: transactionHistory, shop_name: localStorage.getItem('shop_name'), shop_addr: localStorage.getItem('shop_addr') };
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = "kasir_backup.json"; a.click();
    }

    function triggerRestore() { document.getElementById('restoreFile').click(); }
    function handleRestore(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = JSON.parse(e.target.result);
            masterData = data.master_items;
            transactionHistory = data.trx_history;
            localStorage.setItem('master_items', JSON.stringify(masterData));
            localStorage.setItem('trx_history', JSON.stringify(transactionHistory));
            location.reload();
        };
        reader.readAsText(file);
    }
</script>
