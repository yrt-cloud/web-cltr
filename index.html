<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Pro - Fitur Lengkap</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --accent: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #1e293b;
            --border: #e2e8f0;
            --overlay: rgba(0, 0, 0, 0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg);
            font-family: 'Inter', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .app-container {
            display: flex;
            background: #fff;
            width: 98%;
            max-width: 1250px;
            height: 95vh;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 15px;
            gap: 15px;
            position: relative;
        }
        /* MASTER BARANG */
        .master-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            padding-right: 15px;
            min-width: 280px;
        }
        .master-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .search-container {
            position: relative;
            margin-bottom: 10px;
        }
        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: 0.3s;
            font-weight: 600;
        }
        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        .master-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 5px;
        }
        .master-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }
        .master-item:hover, .master-item.selected {
            border: 2px solid var(--success);
            background: #f0fdf4;
            transform: translateX(5px);
        }
        .master-item-info b { font-size: 13px; text-transform: uppercase; display: block; }
        .master-item-info span { font-size: 12px; color: var(--accent); font-weight: 600; }
        
        /* Tombol Hapus di Master Barang */
        .btn-delete-master {
            padding: 8px;
            color: #94a3b8;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .btn-delete-master:hover {
            color: var(--danger);
            background: #fef2f2;
            transform: scale(1.1);
        }
        .btn-delete-master svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* STRUK AREA */
        .receipt-section {
            flex: 0 0 350px;
            display: flex;
            flex-direction: column;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .receipt-view {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            line-height: 1.4;
        }
        .thermal-header { text-align: center; margin-bottom: 10px; position: relative; }
        .btn-settings-trigger {
            position: absolute;
            top: -10px; right: -10px;
            background: none; border: none; cursor: pointer; color: #94a3b8; padding: 5px;
        }
        .btn-settings-trigger:hover { color: var(--accent); }
        .dashed-line { border-top: 1px dashed #000; margin: 10px 0; }
        
        /* CART */
        .cart-row { margin-bottom: 8px; }
        .cart-top { display: flex; justify-content: space-between; font-weight: bold; }
        .cart-bottom { font-size: 11px; color: #444; display: flex; align-items: center; gap: 8px; margin-top: 2px; }
        .qty-input-wrapper { display: flex; align-items: center; background: #f1f5f9; border-radius: 6px; padding: 2px; border: 1px solid #e2e8f0; }
        .qty-input-wrapper input { width: 40px; border: none; background: transparent; text-align: center; font-weight: bold; outline: none; }
        .qty-input-wrapper button { border: none; background: white; width: 20px; height: 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        .summary-row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .total-large { font-size: 18px; font-weight: 900; margin-top: 8px; color: #000; border-top: 1px solid #000; padding-top: 5px; }

        /* CALCULATOR */
        .calc-section {
            flex: 0 0 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-left: 1px solid var(--border);
            padding-left: 15px;
        }
        .calc-display {
            background: var(--dark); color: #fff; padding: 15px; border-radius: 12px;
            text-align: right; font-size: 24px; font-family: monospace; min-height: 60px;
        }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .btn { padding: 12px 5px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; background: #e2e8f0; }

        /* MODAL SYSTEM */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--overlay); display: none; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white; padding: 25px; border-radius: 20px; width: 500px;
            max-width: 95%; box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
        }
        .modal-title { font-size: 18px; font-weight: 800; margin-bottom: 15px; color: var(--dark); text-align: center; }
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; font-weight: bold; color: #64748b; margin-bottom: 5px; }
        .modal-input { width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: 10px; outline: none; }
        
        .btn-remove { color: var(--danger); cursor: pointer; margin-left: auto; }
        .btn-remove svg { width: 16px; height: 16px; fill: currentColor; }

        /* PRINT STYLE - OPTIMIZED FOR 58mm THERMAL */
        @media print {
            @page { size: 58mm auto; margin: 0; }
            body { background: white; margin: 0; padding: 0; width: 58mm; display: block; }
            .no-print { display: none !important; }
            .app-container { display: block; width: 100%; max-width: 100%; margin: 0; padding: 0; box-shadow: none; height: auto; }
            .receipt-section { border: none; width: 100%; border-radius: 0; margin: 0; display: block; }
            .receipt-view { padding: 2mm; font-size: 9pt; width: 100%; overflow: visible; color: black; line-height: 1.2; }
            .thermal-header { margin-bottom: 4mm; }
            .thermal-header h1 { font-size: 12pt; margin-bottom: 1mm; display: block; }
            .thermal-header p { font-size: 8pt; margin: 0; display: block; word-wrap: break-word; }
            .dashed-line { border-top: 1px dashed black; margin: 2mm 0; }
            .cart-row { border-bottom: none; margin-bottom: 1mm; }
            .cart-top { font-size: 9pt; }
            .cart-bottom { font-size: 8pt; }
            .total-large { font-size: 11pt; border-top: 1px dashed black; margin-top: 2mm; padding-top: 1mm; }
            h1 { font-size: 12pt; }
        }
    </style>
</head>
<body onload="init()">

<div class="app-container">
    <!-- MASTER BARANG -->
    <div class="master-section no-print">
        <div class="master-header">
            <h3>DATA BARANG</h3>
            <button class="btn" style="background: var(--success); color:white; padding: 5px 12px;" onclick="addManual()">+ BARANG</button>
        </div>
        <div class="search-container">
            <input type="text" class="search-input" id="searchBar" placeholder="Cari barang..." oninput="renderMaster(true)">
        </div>
        <div class="master-list" id="masterItems"></div>
    </div>

    <!-- STRUK PEMBAYARAN -->
    <div class="receipt-section">
        <div class="receipt-view" id="printArea">
            <div class="thermal-header">
                <button class="btn-settings-trigger no-print" onclick="toggleSettings()" title="Pengaturan">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
                <h1 id="shopNameDisplay">NAMA TOKO</h1>
                <p id="shopAddrDisplay">Alamat Toko</p>
                <div class="dashed-line"></div>
                <div style="display: flex; justify-content: space-between; font-size: 9px;">
                    <span id="trxDate"></span>
                    <span id="trxId"></span>
                </div>
                <div class="dashed-line"></div>
            </div>
            <div id="cartContent"></div>
            <div id="summaryArea">
                <div class="dashed-line"></div>
                <div class="summary-row"><span>ITEM TOTAL</span> <span id="totalQty">0</span></div>
                <div class="summary-row total-large"><span>TOTAL</span> <span id="grandTotal">0</span></div>
            </div>
            <div id="paymentResult" style="display:none; margin-top: 15px;">
                <div class="summary-row"><span>TUNAI</span> <span id="resCash">0</span></div>
                <div class="summary-row"><span>KEMBALI</span> <span id="resChange">0</span></div>
                <div class="dashed-line"></div>
                <p style="text-align: center; font-size: 10px; margin-top: 15px; font-weight: bold;">TERIMA KASIH</p>
            </div>
        </div>
        <div class="no-print" style="padding: 10px; display: grid; gap: 8px; border-top: 1px solid var(--border);">
            <div style="display: flex; gap: 5px;">
                <button class="btn" style="flex:1; background: var(--danger); color:white;" onclick="resetTransaction()">RESET (R)</button>
                <button class="btn" style="flex:1; background: var(--accent); color:white;" onclick="openPayModal()">BAYAR (SPACE)</button>
            </div>
            <button class="btn" style="width:100%; background: var(--dark); color:white;" onclick="printStruk()">CETAK (P)</button>
        </div>
    </div>

    <!-- CALCULATOR -->
    <div class="calc-section no-print">
        <div class="calc-display" id="calcDisplay">0</div>
        <div class="calc-grid">
            <button class="btn" onclick="clearCalc()">C</button>
            <button class="btn" onclick="backspace()">DEL</button>
            <button class="btn" onclick="num('7')">7</button><button class="btn" onclick="num('8')">8</button><button class="btn" onclick="num('9')">9</button>
            <button class="btn" onclick="num('4')">4</button><button class="btn" onclick="num('5')">5</button><button class="btn" onclick="num('6')">6</button>
            <button class="btn" onclick="num('1')">1</button><button class="btn" onclick="num('2')">2</button><button class="btn" onclick="num('3')">3</button>
            <button class="btn" onclick="num('0')">0</button><button class="btn" onclick="num('000')">.000</button>
            <button class="btn" style="background:var(--accent); color:white; grid-column: span 2;" onclick="addToCartManual()">TAMBAH HARGA</button>
        </div>
        <div style="margin-top:10px; font-size:11px; font-weight:bold; color:#64748b">TRANSAKSI TERBARU</div>
        <div class="history-panel" id="trxHistoryLog"></div>
    </div>
</div>

<!-- MODAL PENGATURAN -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
        <div class="modal-title">PENGATURAN TOKO & LAPORAN</div>
        <div class="input-group">
            <label>NAMA TOKO</label>
            <input type="text" class="modal-input" id="setShopName">
        </div>
        <div class="input-group">
            <label>ALAMAT TOKO</label>
            <input type="text" class="modal-input" id="setShopAddr">
        </div>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button class="btn" style="flex:1; background:var(--dark); color:white; font-size:12px" onclick="exportData()">DOWNLOAD BACKUP</button>
            <button class="btn" style="flex:1; background:var(--accent); color:white; font-size:12px" onclick="document.getElementById('importFile').click()">RESTORE DATA</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(event)">
        </div>
        <div style="font-weight:bold; font-size:12px; margin-bottom:10px; color:var(--dark)">RINGKASAN PENJUALAN</div>
        <canvas id="salesChart" width="400" height="200" style="margin-bottom:20px"></canvas>
        <div style="display: flex; gap: 10px;">
            <button class="btn" style="flex:1" onclick="toggleSettings()">BATAL</button>
            <button class="btn" style="flex:1; background:var(--success); color:white;" onclick="saveSettings()">SIMPAN PERUBAHAN</button>
        </div>
    </div>
</div>

<!-- MODAL BAYAR -->
<div class="modal-overlay" id="payModal">
    <div class="modal-content">
        <div class="modal-title">PEMBAYARAN</div>
        <div style="font-size: 32px; font-weight: 900; color: var(--accent); margin-bottom: 20px; text-align:center" id="modalTotalLabel">Rp 0</div>
        <div class="input-group">
            <label>UANG TUNAI</label>
            <input type="text" class="modal-input" id="cashInput" placeholder="Masukkan jumlah uang..." style="font-size:24px; text-align:center">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button class="btn" style="flex:1" onclick="closePayModal()">BATAL (ESC)</button>
            <button class="btn" style="flex:1; background: var(--accent); color: white;" onclick="processPayment()">PROSES (ENTER)</button>
        </div>
    </div>
</div>

<script>
    let masterData = [
        { name: "BERAS PREMIUM 5KG", price: 75000 },
        { name: "GULA PASIR 1KG", price: 16500 },
        { name: "MINYAK GORENG 2L", price: 34000 }
    ];
    let cart = [];
    let transactionHistory = [];
    let currentCalc = "0";
    let selectedIdx = 0;
    let filteredMaster = [];
    let myChart = null;

    // Definisikan ikon sampah SVG di sini
    const trashIcon = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;

    function init() {
        loadSettings();
        newTransaction();
        renderMaster();
        renderHistory();
        
        window.addEventListener('keydown', (e) => {
            const isTyping = document.activeElement.tagName === 'INPUT';
            if (isTyping && document.activeElement.id === 'searchBar') {
                if (e.key === 'ArrowDown') { e.preventDefault(); selectedIdx = Math.min(selectedIdx + 1, filteredMaster.length - 1); renderMaster(false); }
                if (e.key === 'ArrowUp') { e.preventDefault(); selectedIdx = Math.max(selectedIdx - 1, 0); renderMaster(false); }
                if (e.key === 'Enter') { 
                    if(filteredMaster[selectedIdx]) {
                        addToCart(filteredMaster[selectedIdx].name, filteredMaster[selectedIdx].price); 
                        document.getElementById('searchBar').value = ""; renderMaster(); 
                    }
                }
            }
            if (!isTyping) {
                if (e.key === ' ') { e.preventDefault(); openPayModal(); }
                if (e.key.toLowerCase() === 'r') resetTransaction();
                if (e.key.toLowerCase() === 'p') printStruk();
            }
            if (e.key === 'Escape') { closePayModal(); if(document.getElementById('settingsModal').style.display==='flex') toggleSettings(); }
            if (e.key === 'Enter' && document.getElementById('payModal').style.display==='flex') processPayment();
        });
    }

    function loadSettings() {
        const m = localStorage.getItem('master_items');
        if(m) masterData = JSON.parse(m);
        const h = localStorage.getItem('trx_history');
        if(h) transactionHistory = JSON.parse(h);
        const name = localStorage.getItem('shop_name') || "TOKO KITA";
        const addr = localStorage.getItem('shop_addr') || "Jl. Sudirman No. 123";
        document.getElementById('shopNameDisplay').innerText = name;
        document.getElementById('shopAddrDisplay').innerText = addr;
        document.getElementById('setShopName').value = name;
        document.getElementById('setShopAddr').value = addr;
    }

    function toggleSettings() {
        const modal = document.getElementById('settingsModal');
        const isOpen = modal.style.display === 'flex';
        modal.style.display = isOpen ? 'none' : 'flex';
        if(!isOpen) renderChart();
    }

    function saveSettings() {
        localStorage.setItem('shop_name', document.getElementById('setShopName').value);
        localStorage.setItem('shop_addr', document.getElementById('setShopAddr').value);
        loadSettings();
        toggleSettings();
    }

    function exportData() {
        const data = { master: masterData, history: transactionHistory, shop: { name: localStorage.getItem('shop_name'), addr: localStorage.getItem('shop_addr') } };
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `backup_kasir_${Date.now()}.json`; a.click();
    }

    function importData(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const data = JSON.parse(event.target.result);
                if(data.master) { masterData = data.master; localStorage.setItem('master_items', JSON.stringify(masterData)); }
                if(data.history) { transactionHistory = data.history; localStorage.setItem('trx_history', JSON.stringify(transactionHistory)); }
                alert("Data berhasil dipulihkan!"); location.reload();
            } catch(err) { alert("Format file tidak valid."); }
        };
        reader.readAsText(file);
    }

    function format(n) { return Number(n).toLocaleString('id-ID'); }

    function renderMaster(resetIdx = true) {
        if(resetIdx) selectedIdx = 0;
        const q = document.getElementById('searchBar').value.toLowerCase();
        filteredMaster = masterData.filter(i => i.name.toLowerCase().includes(q));
        const container = document.getElementById('masterItems');
        container.innerHTML = filteredMaster.map((item, i) => {
            // Kita cari index asli di masterData untuk keperluan penghapusan
            const originalIndex = masterData.findIndex(orig => orig.name === item.name && orig.price === item.price);
            return `
            <div class="master-item ${i === selectedIdx ? 'selected' : ''}" onclick="handleMasterClick(event, '${item.name}', ${item.price})">
                <div class="master-item-info"><b>${item.name}</b><span>Rp ${format(item.price)}</span></div>
                <div style="display: flex; align-items: center; gap: 4px;">
                    <div class="btn-delete-master" onclick="deleteMasterItem(event, ${originalIndex})" title="Hapus dari data barang">
                        ${trashIcon}
                    </div>
                    <div style="font-weight:bold; color:var(--success); padding: 8px;">+</div>
                </div>
            </div>
        `}).join('');
    }

    function handleMasterClick(event, name, price) {
        if (event.target.closest('.btn-delete-master')) return;
        addToCart(name, price);
    }

    function deleteMasterItem(event, index) {
        event.stopPropagation();
        const itemName = masterData[index].name;
        if (confirm(`Hapus "${itemName}" dari database secara permanen?`)) {
            masterData.splice(index, 1);
            localStorage.setItem('master_items', JSON.stringify(masterData));
            renderMaster(false);
        }
    }

    function addToCart(name, price) {
        const idx = cart.findIndex(i => i.name === name);
        if(idx > -1) cart[idx].qty++;
        else cart.push({ name, price, qty: 1 });
        renderCart();
    }

    function setQty(i, val) {
        let n = parseInt(val);
        if (isNaN(n) || n < 0) n = 0;
        cart[i].qty = n;
        updateTotalsOnly();
    }

    function updateTotalsOnly() {
        let total = 0, q = 0;
        cart.forEach((item, i) => {
            total += (item.price * item.qty);
            q += item.qty;
            const sub = document.getElementById(`subtotal-${i}`);
            if(sub) sub.innerText = format(item.price * item.qty);
        });
        document.getElementById('totalQty').innerText = q;
        document.getElementById('grandTotal').innerText = format(total);
    }

    function renderCart() {
        const container = document.getElementById('cartContent');
        container.innerHTML = cart.map((item, i) => `
            <div class="cart-row">
                <div class="cart-top"><span>${item.name}</span><span id="subtotal-${i}">${format(item.price * item.qty)}</span></div>
                <div class="cart-bottom">
                    <div class="qty-input-wrapper no-print">
                        <button onclick="updateQtyBtn(${i}, -1)">-</button>
                        <input type="number" value="${item.qty}" oninput="setQty(${i}, this.value)" onblur="renderCart()">
                        <button onclick="updateQtyBtn(${i}, 1)">+</button>
                    </div>
                    <span>${item.qty} x ${format(item.price)}</span>
                    <span class="btn-remove no-print" onclick="removeCart(${i})">${trashIcon}</span>
                </div>
            </div>
        `).join('');
        updateTotalsOnly();
    }

    function updateQtyBtn(i, delta) {
        cart[i].qty = Math.max(0, cart[i].qty + delta);
        if(cart[i].qty === 0) removeCart(i);
        else renderCart();
    }

    function removeCart(i) { cart.splice(i, 1); renderCart(); }

    function newTransaction() {
        cart = [];
        const now = new Date();
        document.getElementById('trxId').innerText = "TRX-" + now.getTime().toString().slice(-6);
        document.getElementById('trxDate').innerText = now.toLocaleString('id-ID');
        document.getElementById('paymentResult').style.display = 'none';
        renderCart();
    }

    function resetTransaction() { if(confirm("Reset transaksi?")) newTransaction(); }

    function openPayModal() {
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        if(total === 0) return;
        document.getElementById('modalTotalLabel').innerText = "Rp " + format(total);
        document.getElementById('payModal').style.display = 'flex';
        document.getElementById('cashInput').value = "";
        setTimeout(() => document.getElementById('cashInput').focus(), 100);
    }

    function closePayModal() { document.getElementById('payModal').style.display = 'none'; }

    function processPayment() {
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        let cash = parseInt(document.getElementById('cashInput').value.replace(/\./g, '').replace(/,/g, ''));
        if (!isNaN(cash) && cash > 0 && cash < 1000) cash = cash * 1000;
        if(isNaN(cash) || cash < total) { alert("Uang kurang!"); return; }
        document.getElementById('resCash').innerText = format(cash);
        document.getElementById('resChange').innerText = format(cash - total);
        document.getElementById('paymentResult').style.display = 'block';
        transactionHistory.unshift({ id: document.getElementById('trxId').innerText, total: total, date: new Date().toLocaleTimeString() });
        localStorage.setItem('trx_history', JSON.stringify(transactionHistory.slice(0, 50)));
        renderHistory(); closePayModal();
    }

    function renderHistory() {
        const log = document.getElementById('trxHistoryLog');
        log.innerHTML = transactionHistory.slice(0, 5).map(t => `
            <div style="font-size:11px; padding:8px; border-bottom:1px solid #f1f5f9; display:flex; justify-content:space-between; background:white; margin-bottom:5px; border-radius:8px">
                <div><div style="font-weight:bold">${t.id}</div><div style="color:#94a3b8">${t.date}</div></div>
                <b style="color:var(--success)">Rp ${format(t.total)}</b>
            </div>
        `).join('');
    }

    function printStruk() { window.print(); }

    function num(v) { if(currentCalc === "0") currentCalc = v; else currentCalc += v; updateCalc(); }
    function clearCalc() { currentCalc = "0"; updateCalc(); }
    function backspace() { currentCalc = currentCalc.slice(0, -1) || "0"; updateCalc(); }
    function updateCalc() { document.getElementById('calcDisplay').innerText = format(currentCalc); }
    function addToCartManual() {
        const price = parseInt(currentCalc);
        if(price > 0) { addToCart("ITEM MANUAL", price); clearCalc(); }
    }
    
    function addManual() {
        const n = prompt("Nama Barang:");
        const pStr = prompt("Harga:");
        if (n && pStr) {
            let p = parseInt(pStr);
            if(p < 1000) p = p * 1000;
            masterData.push({name: n.toUpperCase(), price: p}); 
            localStorage.setItem('master_items', JSON.stringify(masterData));
            renderMaster(); 
        }
    }

    function renderChart() {
        const ctx = document.getElementById('salesChart').getContext('2d');
        if(myChart) myChart.destroy();
        const labels = transactionHistory.slice(0, 7).reverse().map(t => t.date);
        const data = transactionHistory.slice(0, 7).reverse().map(t => t.total);
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Penjualan',
                    data: data,
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });
    }
</script>
</body>
</html>
